esphome:
  name: dlna-pcm5102
  friendly_name: DLNA音频接收器

esp32:
  board: esp32s3-devkitc-1-n16r8
  framework:
    type: esp-idf

wifi:
  ssid: "DLNA"
  password: "13665438127"
  ap:
    ssid: "DLNA-PCM5102-SETUP"
    password: "12345678"

logger:

i2c:
  sda: 17
  scl: 18
  scan: true

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled_screen
    lambda: |-
      it.print(0, 0, id(font_small), "DLNA Receiver");
      if (id(dlna_renderer).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
        it.print(0, 16, id(font_small), "Playing");
      } else {
        it.print(0, 16, id(font_small), "Stopped");
      }
      if (id(wifi).is_connected()) {
        it.print(0, 32, id(font_small), "WiFi: OK");
      } else {
        it.print(0, 32, id(font_small), "WiFi: Disconnect");
      }

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10

# I2S音频输出 PCM5102A
audio_i2s:
  - id: i2s_out
    bck_pin: 42
    ws_pin: 38
    dout_pin: 40
    sample_rate: 44100
    bits_per_sample: 16

media_player:
  - platform: dlna
    id: dlna_renderer
    name: "DLNA音乐接收器"
    audio_out: i2s_out

captive_portal:

